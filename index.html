<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リネージュM Lvアップ到達日数計算機</title><style>
body{font-family:'Segoe UI',Tahoma,sans-serif;margin:20px;background:#f4f7f6;color:#333}.container{max-width:500px;margin:auto;background:white;padding:20px 30px;border-radius:10px;box-shadow:0 4px 12px #0002}h1{color:#5a4b70;text-align:center;border-bottom:2px solid #5a4b70;padding-bottom:10px;font-size:20px!important}.input-group{margin-bottom:15px}label{display:block;margin-top:10px;font-weight:bold;color:#555;font-size:16px}input[type=number],input[type=date],select{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;font-size:16px;background:#fff}.input-wrapper{position:relative;display:flex;align-items:center}.input-suffix{position:absolute;right:12px;color:#888;pointer-events:none}.input-wrapper input{padding-right:35px}button{background:#5a4b70;color:#fff;padding:12px;border:0;border-radius:5px;cursor:pointer;margin-top:20px;width:100%;font-size:16px}button:hover{background:#7b6a9a}.result-box{margin-top:25px;padding:15px;border:2px solid #76c7c0;border-radius:5px;background:#e6f7ff;text-align:center}.result-title{font-size:1.1em;font-weight:bold;color:#5a4b70;margin:10px 0 5px}.result-value{font-size:1.65em;font-weight:bold;color:#208d65}.error{color:#c33;font-weight:bold;margin-top:15px;text-align:center}.hint{display:block;color:#777;margin-top:5px;font-size:12px;line-height:1.6}.details{font-size:13px;color:#555;line-height:1.7;margin-top:12px}.notice{font-size:12px;color:#777;line-height:1.6;margin-top:18px}
</style></head><body><div class="container"><h1>Lvアップ到達日数計算機</h1>
<div class="input-group"><label for="startLevel">現在のレベル (70〜92)</label><input type="number" id="startLevel" value="74" min="70" max="92" step="1"></div>
<div class="input-group"><label for="startExpPercent">現在の経験値 (0〜99.99%)</label><div class="input-wrapper"><input type="number" id="startExpPercent" value="88" min="0" max="99.99" step="0.01"><span class="input-suffix">%</span></div></div>
<div class="input-group"><label for="targetLevel">目標レベル (71〜93)</label><input type="number" id="targetLevel" value="80" min="71" max="93" step="1"></div>
<div class="input-group"><label for="dailyExpPercent">1日の獲得経験値（現在のLv換算）</label><div class="input-wrapper"><input type="number" id="dailyExpPercent" value="80" min="0.000001" step="any"><span class="input-suffix">%</span></div><small class="hint">現在のLvで1日に80%稼ぐなら「80」。レベルアップ後も同じ絶対経験値を獲得すると仮定します。</small></div>
<div class="input-group"><label for="startDate">計算基準日</label><input type="date" id="startDate"></div>
<div class="input-group"><label for="firstDay">経験値を獲得し始める日</label><select id="firstDay"><option value="1" selected>翌日から（今日は消化済み）</option><option value="0">当日から</option></select></div>
<button id="calcButton" type="button">到達日数を計算</button><div id="resultMessage" class="error" role="alert" hidden></div>
<div id="resultBox" class="result-box" hidden><div class="result-title">目標到達日</div><div id="targetDate" class="result-value"></div><div class="result-title">必要な獲得日数</div><div id="totalDays" class="result-value"></div><div id="details" class="details"></div></div>
<p class="notice">経験値テーブル：韓国Inven計算機を参考にした暫定値。Lv70〜89は提供されたExcelの値、Lv90〜93は会話内で確認した2026年版v3.43の値を使用。日本版の公式値とは限りません。Lv90以降は配信者の死亡ロスト逆算値と約0.85%の差があります。</p></div>
<script>
const EXP_TABLE={
    70: 3550718780,
    71: 4233683820,
    72: 5029342883,
    73: 5953649898,
    74: 7024482619,
    75: 8261837524,
    76: 9688040963,
    77: 11327977600,
    78: 13209337337,
    79: 15362881827,
    80: 17822734896,
    81: 20001626310,
    82: 22415537902,
    83: 25096518006,
    84: 28038385232,
    85: 31296843514,
    86: 93890530542,
    87: 375562122168,
    88: 1502248488672,
    89: 6008993954688,
    90: 36053963728128,
    91: 216323782368768,
    92: 648971347106304,
    93: 1297942694212608
};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function localToday(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function calculateDays(){
 $('resultMessage').hidden=true;$('resultBox').hidden=true;
 const start=Number($('startLevel').value),target=Number($('targetLevel').value),pct=Number($('startExpPercent').value),dailyPct=Number($('dailyExpPercent').value);
 const dateText=$('startDate').value;
 const valid=Number.isInteger(start)&&Number.isInteger(target)&&start>=70&&start<=92&&target>=71&&target<=93&&target>start&&Number.isFinite(pct)&&pct>=0&&pct<100&&Number.isFinite(dailyPct)&&dailyPct>0&&/^\d{4}-\d{2}-\d{2}$/.test(dateText);
 if(!valid){$('resultMessage').textContent='レベル・経験値率・基準日を確認してください。';$('resultMessage').hidden=false;return;}
 let required=EXP_TABLE[start]*(1-pct/100);
 for(let lv=start+1;lv<target;lv++)required+=EXP_TABLE[lv];
 const daily=EXP_TABLE[start]*dailyPct/100;
 const days=Math.ceil(required/daily-1e-12);
 if(!Number.isFinite(days)||days>10000000){$('resultMessage').textContent='計算可能な範囲を超えました。';$('resultMessage').hidden=false;return;}
 const [y,m,d]=dateText.split('-').map(Number);
 const arrival=new Date(y,m-1,d+Number($('firstDay').value)+days-1,12);
 $('targetDate').textContent=arrival.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
 $('totalDays').textContent=`${days.toLocaleString('ja-JP')}日`;
 $('details').textContent=`残り必要経験値：約${Math.round(required).toLocaleString('ja-JP')} ／ 1日：約${Math.round(daily).toLocaleString('ja-JP')}（現在のLv${start}基準）`;
 $('resultBox').hidden=false;
}
$('startDate').value=localToday();$('calcButton').addEventListener('click',calculateDays);calculateDays();
</script></body></html>
